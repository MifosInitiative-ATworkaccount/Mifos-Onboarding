<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mifos Initiative | Contributor Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f9fafb; font-family: sans-serif; color: #1f2937; overflow: hidden; height: 100vh; margin: 0; }
    .skills-card { background: white; padding: 1.5rem; text-align: center; border: 2px solid #e5e7eb; border-radius: 0.75rem; cursor: pointer; transition: 0.2s; }
    .skills-card.selected { border-color: #0099cc; background-color: #f0f9ff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06); }
    #appLayout { display: none; } /* Hidden by default */
  </style>

  <!-- Global Error Catcher -->
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      alert("System Error: " + message + " at line " + lineno);
    };
  </script>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    try {
      !function(t,e){var o,n,p,r;e.__SV||(window.posthog && window.posthog.__loaded)||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}p||((p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",p.onerror=function(){p=null},(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r));var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="Sn Cn init Hn Un Gn Yi zn Kn qn capture Vn kn calculateEventProperties es register register_once register_for_session unregister unregister_for_session os Bn ss getFeatureFlag getFeatureFlagPayload getFeatureFlagResult getAllFeatureFlags isFeatureEnabled reloadFeatureFlags updateFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSurveysLoaded onSessionId getSurveys getActiveMatchingSurveys renderSurvey displaySurvey cancelPendingSurvey canRenderSurvey canRenderSurveyAsync ls identify setPersonProperties unsetPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset us shutdown setIdentity clearIdentity get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException addExceptionStep captureLog startExceptionAutocapture stopExceptionAutocapture loadToolbar get_property getSessionProperty rs Xn createPersonProfile setInternalOrTestUser ns $n vs opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing get_explicit_consent_status is_capturing clea       posthog.init('phc_kLTg9t8gwgiWkrbtvof8d7yyrJtcHHSjoy2QpeQSxieX', { api_host: 'https://us.i.posthog.com', person_profiles: 'identified_only' });
    } catch(e) { console.warn("PostHog blocked."); }
  </script>
</head>
<body>

  <!-- ============================================== -->
  <!-- 1. ASSESSMENT ONRAMP                           -->
  <!-- ============================================== -->
  <div id="onrampOverlay" class="fixed inset-0 bg-blue-900 z-50 overflow-y-auto px-4 py-8 flex justify-center items-center" style="background-color: #006699;">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full p-8 md:p-10">
      <div class="pb-6 border-b border-gray-100 mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold" style="color: #006699;">Welcome to Mifos!</h1>
        <p class="text-gray-600 mt-2">Select your expertise below. (Click a card to select it).</p>
      </div>

      <div class="space-y-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          
          <!-- Card 1 -->
          <div class="skills-card" id="card-backend" onclick="selectCard('backend')">
            <input type="radio" name="track" value="backend" id="radio-backend" class="w-5 h-5 mb-2 cursor-pointer">
            <span class="block font-bold text-gray-800">Backend</span>
            <small class="text-gray-500">Java/Spring</small>
          </div>
          
          <!-- Card 2 -->
          <div class="skills-card" id="card-frontend" onclick="selectCard('frontend')">
            <input type="radio" name="track" value="frontend" id="radio-frontend" class="w-5 h-5 mb-2 cursor-pointer">
            <span class="block font-bold text-gray-800">Frontend</span>
            <small class="text-gray-500">React/KMP</small>
          </div>

          <!-- Card 3 -->
          <div class="skills-card" id="card-ai" onclick="selectCard('ai')">
            <input type="radio" name="track" value="ai" id="radio-ai" class="w-5 h-5 mb-2 cursor-pointer">
            <span class="block font-bold text-gray-800">AI & Data</span>
            <small class="text-gray-500">Python/ML</small>
          </div>

          <!-- Card 4 -->
          <div class="skills-card" id="card-ops" onclick="selectCard('ops')">
            <input type="radio" name="track" value="ops" id="radio-ops" class="w-5 h-5 mb-2 cursor-pointer">
            <span class="block font-bold text-gray-800">Operations</span>
            <small class="text-gray-500">Docs/UX</small>
          </div>

        </div>

        <div class="pt-6 border-t border-gray-100 flex justify-end">
          <button type="button" onclick="startOnboarding()" class="text-white text-lg font-bold py-4 px-10 rounded-xl shadow-lg transition-all" style="background-color: #006699;">Generate My Custom Portal →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 2. MAIN APPLICATION UI                         -->
  <!-- ============================================== -->
  <div id="appLayout" class="flex h-screen w-full">
    <aside id="sidebar" class="w-72 bg-gray-900 text-white flex flex-col shadow-2xl z-20 shrink-0">
      <div class="p-6 border-b border-gray-800">
        <h1 class="text-xl font-black tracking-wide text-white">MIFOS INITIATIVE</h1>
        <p class="text-gray-400 text-xs mt-1 uppercase tracking-widest font-semibold" id="sb-role">Contributor Portal</p>
      </div>
      <div class="flex-1 overflow-y-auto p-4">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4 px-2">Your Custom Path</h2>
        <ul id="moduleList" class="space-y-2"></ul>
      </div>
      <div class="p-4 bg-gray-950 border-t border-gray-800">
          <button type="button" onclick="resetApp()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-xs py-3 px-3 rounded">Change Track / Reset</button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen relative bg-gray-50">
      <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-8 shadow-sm shrink-0">
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Open Source Portal</h2>
        <div class="flex items-center space-x-4">
          <span class="text-xs font-bold text-gray-500" id="progressText">0%</span>
          <div class="w-32 bg-gray-200 rounded-full h-2 overflow-hidden">
            <div id="progressBar" class="bg-green-500 h-2 w-0"></div>
          </div>
        </div>
      </header>
      <div class="flex-1 overflow-y-auto p-6 md:p-10">
        <div class="max-w-5xl mx-auto" id="moduleContainer"></div>
      </div>
    </main>
  </div>

  <script>
    // ---------------------------------------------------------
    // 1. VISUAL CARD SELECTOR
    // ---------------------------------------------------------
    function selectCard(trackValue) {
      ['backend', 'frontend', 'ai', 'ops'].forEach(t => {
        document.getElementById('radio-' + t).checked = false;
        document.getElementById('card-' + t).classList.remove('selected');
      });
      document.getElementById('radio-' + trackValue).checked = true;
      document.getElementById('card-' + trackValue).classList.add('selected');
    }

    // ---------------------------------------------------------
    // 2. SUPABASE INITIALIZATION (Renamed to supabaseClient)
    // ---------------------------------------------------------
    const supabaseUrl = 'https://gcaegiujykghvppqwdfq.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjYWVnaXVqeWtnaHZwcHF3ZGZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Mzc2NjksImV4cCI6MjEwMjMxMzY2OX0.39WpRDBs4A-_Ah5Qhpg2rcq7tVVVe17Tk8eE7betEy8';
    
    let supabaseClient = null;
    let volunteerDatabase = [];

    try { 
      if (window.supabase) supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey); 
    } 
    catch (e) { console.warn("Supabase failed to init."); }

    async function fetchVolunteers() {
      if (!supabaseClient) return; 
      try {
        const { data, error } = await supabaseClient.from('volunteers').select('*').order('id', { ascending: false });
        if (data) volunteerDatabase = data;
        if (appState.currentStep === 's_directory') renderDirectoryList("");
      } catch (e) { console.warn("Fetch failed", e); }
    }

    // ---------------------------------------------------------
    // 3. STATE & DATA VAULT
    // ---------------------------------------------------------
    let appState = { isConfigured: false, track: null, currentStep: null, completedSteps: [] };
    
    try {
      const saved = localStorage.getItem('mifosStateFinal');
      if (saved) appState = JSON.parse(saved);
    } catch(e) {}

    const personaData = {
      backend: { themeClass: 'bg-orange-600', icon: '☕', title: 'Backend Engineering', greeting: 'Welcome, Backend Contributor!', dashboardStrategy: 'We need your help squashing Java bugs and reviewing basic API endpoints.', modules: ['c_entry', 'c_pr', 'm_fineract', 's_final', 's_directory'] },
      frontend: { themeClass: 'bg-indigo-700', icon: '📱', title: 'Frontend & Mobile', greeting: 'Welcome, Frontend Contributor!', dashboardStrategy: 'We need help fixing UI bugs in the Mifos web and mobile apps.', modules: ['c_entry', 'c_pr', 'm_ui_setup', 's_final', 's_directory'] },
      ai: { themeClass: 'bg-purple-700', icon: '🧠', title: 'AI & Data Science', greeting: 'Welcome, AI Contributor!', dashboardStrategy: 'You will help us clean financial datasets and test AI chatbot prompts.', modules: ['c_entry', 'c_pr', 'm_ai_architecture', 's_final', 's_directory'] },
      ops: { themeClass: 'bg-emerald-700', icon: '🌍', title: 'Community Operations', greeting: 'Welcome, Advocate!', dashboardStrategy: 'You can make an immense impact by proofreading documentation.', modules: ['c_entry', 'm_docs_setup', 's_final', 's_directory'] }
    };

    const vault = {
      c_entry: { title: "Community Entry & Legal", type: "MANDATORY", content: `<p class="mb-4 text-lg">Join Slack and sign the CLA.</p>` },
      c_pr: { title: "The Strict Git & PR Workflow", type: "MANDATORY", content: `<p class="mb-4 text-lg">Branch off develop and squash commits.</p>` },
      m_fineract: { title: "Fineract Setup", type: "TECHNICAL", content: `<p class="mb-4 text-lg">Use Docker Compose to launch Fineract.</p>` },
      m_ui_setup: { title: "Web App Connect", type: "TECHNICAL", content: `<p class="mb-4 text-lg">Connect your UI directly to demo.mifos.io.</p>` },
      m_ai_architecture: { title: "Data Pipelines", type: "TECHNICAL", content: `<p class="mb-4 text-lg">Extract JSON payloads via Jupyter Notebooks.</p>` },
      m_docs_setup: { title: "Wiki Access", type: "COMMUNITY", content: `<p class="mb-4 text-lg">Request Confluence access via mailing list.</p>` }
    };

    let activePersona = null;
    let activeModules = [];

    // ---------------------------------------------------------
    // 4. CORE ENGINE LOGIC
    // ---------------------------------------------------------
    function startOnboarding() {
      let selectedTrack = null;
      const radios = document.getElementsByName('track');
      for (let i = 0; i < radios.length; i++) {
        if (radios[i].checked) selectedTrack = radios[i].value;
      }

      if (!selectedTrack) {
        alert("Action Required: Please click on one of the 4 track boxes first.");
        return;
      }

      try { if (window.posthog) posthog.capture('Started Onboarding', { track: selectedTrack }); } catch(e){}

      appState = { isConfigured: true, track: selectedTrack, currentStep: 'dashboard', completedSteps: [] };
      saveAndRender();
    }

    function saveAndRender() {
      try { localStorage.setItem('mifosStateFinal', JSON.stringify(appState)); } catch(e) {}
      renderUI();
    }

    function selectStep(id) {
      appState.currentStep = id;
      saveAndRender();
    }

    function completeStep(id) {
      if (!appState.completedSteps.includes(id)) appState.completedSteps.push(id);
      try { if(window.posthog) posthog.capture('Module Completed', { module: id }); } catch(e){}
      
      const idx = activeModules.indexOf(id);
      if (idx < activeModules.length - 1) appState.currentStep = activeModules[idx + 1];
      saveAndRender();
    }

    function resetApp() {
      try { localStorage.removeItem('mifosStateFinal'); } catch(e) {}
      window.location.reload();
    }

    function renderUI() {
      if (!appState.isConfigured) {
        document.getElementById('onrampOverlay').style.display = 'flex';
        document.getElementById('appLayout').style.display = 'none';
        return;
      }
      
      document.getElementById('onrampOverlay').style.display = 'none';
      document.getElementById('appLayout').style.display = 'flex';

      activePersona = personaData[appState.track];
      document.getElementById('sidebar').className = `w-72 text-white flex flex-col shadow-2xl z-20 shrink-0 ${activePersona.themeClass}`;
      document.getElementById('sb-role').innerText = activePersona.title;
      activeModules = ['dashboard', ...activePersona.modules];
      
      renderNavigation();
      renderProgress();
      renderContent();
    }

    // ---------------------------------------------------------
    // 5. DOM INJECTION
    // ---------------------------------------------------------
    function renderNavigation() {
      const list = document.getElementById('moduleList');
      list.innerHTML = '';
      activeModules.forEach((modId, index) => {
        const isCompleted = appState.completedSteps.includes(modId);
        const isActive = appState.currentStep === modId;
        let title = modId === 'dashboard' ? 'Overview' : modId === 's_final' ? 'First Contribution' : modId === 's_directory' ? 'Volunteer Log' : vault[modId].title;
        let classes = isActive ? 'bg-white/20 text-white font-bold' : 'text-white/70 hover:bg-white/10 cursor-pointer';

        list.innerHTML += `<li class="flex items-center justify-between p-3 rounded-lg text-sm mb-1 ${classes}" onclick="selectStep('${modId}')"><span>${title}</span><span>${isCompleted ? '✓' : ''}</span></li>`;
      });
    }

    function renderProgress() {
      const total = activeModules.length;
      const pct = Math.round((appState.completedSteps.length / total) * 100);
      document.getElementById('progressText').innerText = `${pct}% Complete`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function renderDirectoryList(filterText = "") {
      const listContainer = document.getElementById('volunteerList');
      if (!listContainer) return;
      listContainer.innerHTML = '';
      
      const lowerFilter = filterText.toLowerCase();
      const filtered = volunteerDatabase.filter(v => (v.name && v.name.toLowerCase().includes(lowerFilter)) || (v.track && v.track.toLowerCase().includes(lowerFilter)));

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p class="text-gray-500 p-4">No volunteers found.</p>';
        return;
      }

      filtered.forEach(vol => {
        listContainer.innerHTML += `<div class="bg-white border border-gray-200 p-4 rounded-xl shadow-sm mb-3">
            <h4 class="font-bold text-gray-900 text-lg">${vol.name}</h4>
            <p class="text-sm text-gray-600"><strong>Track:</strong> ${vol.track}</p>
            <p class="text-sm text-gray-600"><strong>Issue:</strong> ${vol.issues_completed}</p>
          </div>`;
      });
    }

    async function submitLogEntry() {
      const nameVal = document.getElementById('vol_name').value;
      const issueVal = document.getElementById('vol_issue').value;

      if(!nameVal || !issueVal) { alert("Please fill out name and issue ID."); return; }

      const newEntry = { name: nameVal, track: activePersona.title, specialty: "N/A", issues_completed: issueVal };

      if (supabaseClient) {
        document.getElementById('logSubmitBtn').innerText = "Saving...";
        const { error } = await supabaseClient.from('volunteers').insert([newEntry]);
        if (error) alert("Supabase Error: " + error.message);
      } else {
        volunteerDatabase.unshift(newEntry);
      }

      document.getElementById('vol_name').value = ""; document.getElementById('vol_issue').value = "";
      document.getElementById('logSubmitBtn').innerText = "Submit Log Entry";
      
      alert("Successfully Added to the Database!");
      fetchVolunteers();
    }

    function renderContent() {
      const container = document.getElementById('moduleContainer');
      const isCompleted = appState.completedSteps.includes(appState.currentStep);
      let btnHTML = `<div class="mt-10"><button type="button" onclick="completeStep('${appState.currentStep}')" class="bg-gray-900 text-white font-bold py-3 px-8 rounded-xl shadow-md ${isCompleted ? 'opacity-50' : ''}" ${isCompleted ? 'disabled' : ''}>${isCompleted ? 'Completed ✓' : 'Mark Complete'}</button></div>`;

      if (appState.currentStep === 'dashboard') {
        container.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8"><div class="text-6xl mb-4">${activePersona.icon}</div><h1 class="text-3xl font-black text-gray-900 tracking-tight">${activePersona.greeting}</h1><p class="text-lg text-gray-500 mt-2">${activePersona.dashboardStrategy}</p>${btnHTML}</div>`;
        return;
      }
      if (appState.currentStep === 's_final') {
        container.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8"><h1 class="text-3xl font-black text-gray-900">Ready to Contribute!</h1><p class="text-lg text-gray-600 mt-2">Go to Jira and claim your first issue.</p>${btnHTML}</div>`;
        return;
      }
      if (appState.currentStep === 's_directory') {
        container.innerHTML = `
          <div class="mb-8"><h1 class="text-3xl font-black text-gray-900 tracking-tight mb-2">Volunteer Log</h1><p class="text-gray-600">Search the ledger or log your PR.</p></div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-bold text-gray-900 mb-4">Log a Contribution</h3>
                <div class="space-y-4">
                  <input type="text" id="vol_name" placeholder="Your Name" class="w-full border p-2 rounded">
                  <input type="text" id="vol_issue" placeholder="Jira ID (e.g. MIFOSX-1)" class="w-full border p-2 rounded">
                  <button type="button" id="logSubmitBtn" onclick="submitLogEntry()" class="w-full bg-blue-600 text-white font-bold py-2 rounded">Submit</button>
                </div>
            </div>
            <div>
              <input type="text" id="dirSearch" onkeyup="renderDirectoryList(this.value)" placeholder="Search directory..." class="w-full border-2 p-3 rounded-xl mb-4">
              <div id="volunteerList">Loading database...</div>
            </div>
          </div>`;
        fetchVolunteers(); return;
      }

      const modData = vault[appState.currentStep];
      container.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8"><h1 class="text-3xl font-black text-gray-900 tracking-tight mb-4">${modData.title}</h1>${modData.content}${btnHTML}</div>`;
    }

    // FIRE IT UP!
    fetchVolunteers();
    renderUI();
  </script>
</body>
</html>
